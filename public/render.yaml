services:
  - type: web
    name: poker-chines-online
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install --production --non-interactive --network-timeout 600000
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
